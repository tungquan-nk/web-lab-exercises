<!DOCTYPE html>

<head>
    <script src='https://unpkg.com/react@18/umd/react.development.js'></script>
    <script src='https://unpkg.com/react-dom@18/umd/react-dom.development.js'></script>
    <script src='https://unpkg.com/@babel/standalone/babel.min.js'></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f4f4f4;
        }

        input {
            margin: 4px 0;
            padding: 6px;
            box-sizing: border-box;
        }

        button {
            margin-right: 4px;
            padding: 5px 10px;
            cursor: pointer;
        }

        .btn-delete {
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 3px;
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        /* Modal Content */
        .modal-content {
            background: #fff;
            padding: 6px;
            border-radius: 6px;
            width: 300px;
        }
    </style>
</head>

<body>
    <div id='root'></div>
    <script type="text/babel">
        function App() {
            const [kw, setKeyword] = React.useState("");
            const [newUser, setNewUser] = React.useState(null);
            return (
                <div>
                    <h1>Quản lý người dùng</h1>
                    <SearchForm onChangeValue={setKeyword} />
                    <AddUser onAdd={setNewUser} />
                    <ResultTable keyword={kw} user={newUser} onAdded={() => setNewUser(null)} />
                </div>
            );
        }

        function SearchForm({ onChangeValue }) {
            return (
                <input
                    type="text"
                    placeholder="Tìm theo name, username"
                    onChange={(e) => onChangeValue(e.target.value)}
                />
            );
        }

        function ResultTable({ keyword, user, onAdded }) {
            const [users, setUsers] = React.useState([]);
            const [loading, setLoading] = React.useState(true);
            const [editing, setEditing] = React.useState(null);

            // Tải dữ liệu 1 lần khi component mount 
            React.useEffect(() => {
                fetch("https://jsonplaceholder.typicode.com/users")
                    .then(res => res.json())
                    .then(data => { setUsers(data); setLoading(false); });
            }, []);

            // 4. Lọc danh sách theo keyword
            const filteredUsers = users.filter(
                (u) =>
                    u.name.toLowerCase().includes(keyword.toLowerCase()) ||
                    u.username.toLowerCase().includes(keyword.toLowerCase())
            );

            React.useEffect(() => {
                if (user) {
                    setUsers((prev) => [...prev, { ...user, id: prev.length + 1 }]);
                    onAdded();
                }
            }, [user]);

            function editUser(user) {
                setEditing({ ...user, address: { ...user.address } });
            }

            function saveUser() {
                setUsers(prev => prev.map(u => u.id === editing.id ? editing : u));
                setEditing(null);
            }

            function handleEditChange(field, value) {
                if (["street", "suite", "city"].includes(field)) {
                    setEditing((prev) => ({
                        ...prev,
                        address: { ...prev.address, [field]: value }
                    }));
                } else {
                    setEditing((prev) => ({ ...prev, [field]: value }));
                }
            }

            function removeUser(id) {
                // Giữ lại tất cả người dùng có id khác với id cần xóa 
                setUsers((prev) => prev.filter((u) => u.id != id));
            }
            <button className="btn-delete" onClick={() => removeUser(user.id)}>Xóa</button>

            if (loading) return <p>Đang tải dữ liệu...</p>;

            // 5. Hiển thị dữ liệu bằng map trong return
            return (
                <div>
                    {editing && (
                        <div className="modal-overlay">
                            <div className="modal-content">
                                <label htmlFor="name"> Name </label>
                                <input id="name" type="text" value={editing.name} onChange={(e) => handleEditChange("name", e.target.value)} />
                                <button onClick={saveUser}>Lưu</button>
                                <button onClick={() => setEditing(null)}>Hủy</button>
                            </div>
                        </div>
                    )}
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Họ tên</th>
                                <th>Username</th>
                                <th>Email</th>
                                <th>Địa chỉ</th>
                                <th>Số điện thoại</th>
                                <th>Hành động</th>
                            </tr>
                        </thead>
                        <tbody>
                            {filteredUsers.map((u) => (
                                <tr key={u.id}>
                                    <td>{u.id}</td>
                                    <td>{u.name}</td>
                                    <td>{u.username}</td>
                                    <td>{u.email}</td>
                                    <td>
                                        {u.address.street}, {u.address.suite}, {u.address.city}
                                    </td>
                                    <td>{u.phone}</td>
                                    <td>
                                        <button onClick={() => editUser(u)}>Sửa</button>
                                        <button onClick={() => removeUser(u.id)}>Xóa</button>
                                    </td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            );
        }

        // 6. Khai báo Component AddUser, sau đó chạy ứng dụng
        function AddUser({ onAdd }) {
            const [adding, setAdding] = React.useState(false);
            const [user, setUser] = React.useState({
                name: "", username: "", email: "",
                address: { street: "", suite: "", city: "" },
                phone: "", website: ""
            });
            const handleChange = (e) => {
                const { id, value } = e.target;
                if (["street", "suite", "city"].includes(id)) {
                    setUser({ ...user, address: { ...user.address, [id]: value } });
                } else {
                    setUser({ ...user, [id]: value });
                }
            };
            const handleAdd = () => {
                if (user.name === "" || user.username === "") {
                    alert("Vui lòng nhập Name và Username!");
                    return;
                }
                onAdd(user);
                setUser({ name: "", username: "", email: "", address: { street: "", suite: "", city: "" }, phone: "", website: "" });
                setAdding(false);
            };

            return (
                <div>
                    <button onClick={() => setAdding(true)}>Thêm</button>
                    {adding && (
                        <div className="modal-overlay">
                            <div className="modal-content">
                                <h4>Thêm người dùng</h4>
                                <label htmlFor="name"> Name: </label>
                                <input id="name" type="text" value={user.name} onChange={handleChange} />
                                <input id="username" type="text" value={user.username} onChange={handleChange} />
                                <button onClick={handleAdd}>Thêm</button>
                                <button onClick={() => setAdding(false)}>Hủy</button>
                            </div>
                        </div>
                    )}
                </div>
            )
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
